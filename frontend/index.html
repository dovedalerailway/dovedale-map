<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>Dovedale Live Map</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..700"
		/>
		<meta
			name="description"
			content="A live map of Dovedale Railway, showing players with a server selector."
		/>
		<meta
			name="keywords"
			content="dovedale, railway, dovedale railway, dovedale map, live map, dovedale railway map"

		<meta name="twitter:card" content="summary_large_image" />

		/>

			name="twitter:image"
			content="https://map.dovedale.uk/images/map-small.png"

	<body style="background-color: #09090b">
